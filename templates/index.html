<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Crocle - File Transfer Dashboard</title>
    <link rel="icon" type="image/png" href="/assets/crocle.png" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#22c55e',
              'background-light': '#f8fafc',
              'background-dark': '#0f0f0f',
              'card-dark': '#1a1a1a',
              'card-border': '#2a2a2a',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            borderRadius: {
              DEFAULT: '0.75rem',
              lg: '1rem',
            },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply font-sans;
        }
      }

      .file-item:hover {
        background-color: rgba(255, 255, 255, 0.03);
      }

      .file-item.is-selected {
        @apply bg-primary/5 text-primary;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #333;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      @media (min-width: 1024px) {
        .sidebar-sticky {
          position: sticky;
          top: 5rem;
          height: calc(100vh - 10rem);
        }

        .main-content-height {
          height: calc(100vh - 10rem);
        }
      }
    </style>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-background-light text-slate-900 dark:bg-background-dark dark:text-slate-100">
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white dark:border-card-border dark:bg-background-dark">
      <div class="mx-auto flex h-16 max-w-[1500px] items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center">
            <img src="/assets/crocle.png" alt="Crocle" class="h-10 w-10 rounded-md object-cover" />
          </div>
          <h1 class="text-xl font-bold tracking-tight">Crocle</h1>
        </div>
        <nav class="flex items-center gap-4 sm:gap-6">
          <a class="text-sm font-medium text-slate-500 transition-colors hover:text-slate-900 dark:text-slate-400 dark:hover:text-white" href="/acknowledgements">Acknowledgements</a>
          <a
            class="flex items-center gap-2 rounded-full border border-slate-300 px-4 py-1.5 text-sm font-medium transition-all hover:bg-slate-100 dark:border-card-border dark:hover:bg-card-border"
            href="https://github.com/tsecret/crocle"
            target="_blank"
            rel="noreferrer"
          >
            <span>GitHub</span>
            <span class="material-symbols-outlined text-[18px]">open_in_new</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-[1500px] p-4 sm:p-6">
      <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-12">
        <div class="main-content-height flex flex-col lg:col-span-8">
          <div
            id="files"
            class="flex h-full min-h-[22rem] flex-col overflow-hidden rounded-lg border border-slate-200 bg-white dark:border-card-border dark:bg-card-dark"
            hx-get="/files"
            hx-swap="innerHTML"
            hx-trigger="load"
          >
            <div class="space-y-3 p-5 animate-pulse">
              <div class="h-4 w-1/3 rounded bg-slate-200 dark:bg-slate-700/50"></div>
              <div class="h-10 rounded bg-slate-200 dark:bg-slate-700/35"></div>
              <div class="h-10 rounded bg-slate-200 dark:bg-slate-700/25"></div>
              <div class="h-10 rounded bg-slate-200 dark:bg-slate-700/20"></div>
            </div>
          </div>
        </div>

        <div class="sidebar-sticky flex h-full flex-col gap-4 lg:col-span-4">
          <section class="rounded-lg border border-slate-200 bg-white p-5 dark:border-card-border dark:bg-card-dark">
            <div class="mb-4 flex items-center justify-between">
              <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Selection</span>
            </div>
            <div class="mb-5 rounded-lg border border-primary/20 bg-primary/5 p-3">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-3xl text-primary">check_circle</span>
                <div>
                  <h4 id="selected-file" class="text-sm font-semibold" data-file-path="">No file selected</h4>
                  <p id="selection-status" class="text-xs text-slate-500">Select a file to start a transfer.</p>
                </div>
              </div>
            </div>
            <button id="send-button" class="w-full rounded-lg bg-primary px-4 py-3 text-sm font-bold text-black shadow-lg shadow-primary/20 transition-all hover:bg-emerald-600 disabled:cursor-not-allowed disabled:opacity-50" disabled>
              Send File
            </button>
          </section>

          <section class="flex min-h-0 flex-1 flex-col rounded-lg border border-slate-200 bg-white p-5 dark:border-card-border dark:bg-card-dark">
            <div class="mb-4 flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider">Current transfers</h3>
              <span class="h-2 w-2 rounded-full bg-slate-700"></span>
            </div>
            <div
              class="min-h-0 flex-1 overflow-y-auto"
              hx-get="/transfers"
              hx-trigger="load, every 5s [document.hasFocus()], every 15s [!document.hasFocus()]"
            ></div>
          </section>
        </div>
      </div>
    </main>

    <script>
      const selectedFile = document.getElementById('selected-file')
      const selectionStatus = document.getElementById('selection-status')
      const sendButton = document.getElementById('send-button')

      function clearSelectedRows() {
        document.querySelectorAll('[data-file-row], [data-folder-row]').forEach((row) => {
          row.classList.remove('is-selected')
        })
      }

      function updateSelection(target) {
        clearSelectedRows()
        target.classList.add('is-selected')
        const fileName = target.dataset.fileName
        const filePath = target.dataset.filePath || fileName
        selectedFile.textContent = fileName
        selectedFile.dataset.filePath = filePath
        selectionStatus.textContent = 'Ready to send.'
        sendButton.removeAttribute('disabled')
      }

      function updateFolderSelection(target) {
        clearSelectedRows()
        target.classList.add('is-selected')
        const folderPath = target.dataset.folderPath
        selectedFile.textContent = folderPath
        selectedFile.dataset.filePath = folderPath
        selectionStatus.textContent = 'Folder selected, ready to send.'
        sendButton.removeAttribute('disabled')
      }

      async function startTransfer() {
        const fileName = selectedFile.dataset.filePath
        if (!fileName) return

        const hash = 'imohash'

        sendButton.setAttribute('disabled', 'disabled')
        selectionStatus.textContent = 'Starting transfer...'

        const formData = new FormData()
        formData.set('filename', fileName)
        formData.set('hash', hash)

        const response = await fetch('/transfer', {
          method: 'POST',
          body: formData,
        })

        const data = await response.json()
        if (!response.ok) {
          selectionStatus.textContent = data.error || 'Unable to start transfer.'
          sendButton.removeAttribute('disabled')
          return
        }
        selectionStatus.textContent = 'Transfer started. Monitor status below.'
        sendButton.removeAttribute('disabled')
      }

      document.addEventListener('click', (event) => {
        const copyButton = event.target.closest('[data-copy-code]')
        if (copyButton) {
          const code = copyButton.dataset.code
          if (!code) return
          if (!navigator.clipboard?.writeText) return
          navigator.clipboard
            .writeText(code)
            .then(() => {
              const originalHtml = copyButton.innerHTML
              copyButton.textContent = 'Copied'
              setTimeout(() => {
                copyButton.innerHTML = originalHtml
                if (window.lucide) {
                  window.lucide.createIcons()
                }
              }, 1200)
            })
            .catch(() => {})
          return
        }

        const row = event.target.closest('[data-file-row]')
        if (!row) return
        updateSelection(row)
      })

      document.addEventListener('click', (event) => {
        const row = event.target.closest('[data-folder-row]')
        if (!row) return
        updateFolderSelection(row)
      })

      document.addEventListener('dblclick', (event) => {
        const row = event.target.closest('[data-folder-row]')
        if (!row) return
        const folderPath = row.dataset.folderPath
        if (!folderPath) return
        htmx.ajax('GET', `/files?path=${encodeURIComponent(folderPath)}`, {
          target: '#files',
          swap: 'innerHTML',
        })
      })

      sendButton.addEventListener('click', startTransfer)

      document.addEventListener('htmx:afterSwap', () => {
        if (window.lucide) {
          window.lucide.createIcons()
        }
      })

      if (window.lucide) {
        window.lucide.createIcons()
      }

      sendButton.setAttribute('disabled', 'disabled')
    </script>
  </body>
</html>
